name: Super Performance Agent
on:
  schedule:
    # This runs at 20:00 UTC every Sunday (6:00 AM Monday AEST)
    - cron: '0 20 * * 0'
  workflow_dispatch:
    # This allows you to run the agent manually at any time

jobs:
  build:
    runs-on: ubuntu-latest
    # This gives the agent permission to write the report back to your repo
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Super Agent
        run: python agent.py

      - name: Commit and Push Report
        run: |
          git config --global user.name 'Super-Agent-Bot'
          git config --global user.email 'agent@github.com'
          # This adds the new report file created in the /reports folder
          git add reports/*.md
          # Only commit if there are changes to avoid errors
          git diff --quiet && git diff --staged --quiet || (git commit -m "Agent Update: $(date +'%Y-%m-%d')" && git push)
